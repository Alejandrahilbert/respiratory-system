<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT</title>
  <style>
    :root {
      --page-bg: #fff;
      --ink: #0d0d0d;
      --muted: #676767;
      --quiet: #8f8f8f;
      --hover: #ececec;
      --bubble: #f4f4f4;
      --rule: #e7e7e7;
      --content-width: 960px;
      --composer-width: 820px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--page-bg);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, textarea { font: inherit; }
    button { color: inherit; }

    .icon {
      width: 24px;
      height: 24px;
      display: block;
      flex: 0 0 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .app { min-height: 100dvh; display: flex; }

    .icon-button {
      width: 36px;
      height: 36px;
      padding: 6px;
      border: 0;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: transparent;
      cursor: default;
    }

    .icon-button:hover { background: var(--hover); }

    .main {
      min-width: 0;
      height: 100dvh;
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--page-bg);
    }

    .main-header {
      height: 56px;
      flex: 0 0 56px;
      padding: 0 18px 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,.92);
      z-index: 5;
    }

    .model-button, .share-button, .more-button {
      border: 0;
      background: transparent;
      border-radius: 9px;
      height: 36px;
      display: flex;
      align-items: center;
      cursor: default;
    }

    .model-button { padding: 0 9px; gap: 7px; font-size: 18px; font-weight: 600; letter-spacing: -.3px; }
    .model-button:hover, .share-button:hover, .more-button:hover { background: #f4f4f4; }
    .model-button .icon { width: 16px; height: 16px; flex-basis: 16px; stroke-width: 2; }
    .main-header-left { display: flex; align-items: center; }

    .main-actions { display: flex; align-items: center; gap: 4px; }
    .share-button { padding: 0 10px; gap: 7px; font-size: 14px; font-weight: 500; }
    .share-button .icon { width: 20px; height: 20px; flex-basis: 20px; }
    .more-button { width: 36px; padding: 6px; justify-content: center; }

    .conversation {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }

    .thread {
      width: min(var(--content-width), calc(100% - 48px));
      min-height: 100%;
      margin: 0 auto;
      padding: 14px 0 170px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .thread.empty { justify-content: flex-end; }

    .user-message {
      max-width: min(78%, 590px);
      margin-left: auto;
      padding: 9px 14px;
      border-radius: 22px;
      background: var(--bubble);
      font-size: 15px;
      line-height: 1.45;
    }

    .assistant-message { max-width: 100%; font-size: 15.25px; line-height: 1.58; color: #181818; }
    .assistant-message p { margin: 0 0 14px; }
    .assistant-message p:last-child { margin-bottom: 0; }

    .thread.compact {
      gap: 18px;
      padding-top: 10px;
      padding-bottom: 158px;
    }

    .thread.compact .assistant-message { line-height: 1.5; }
    .thread.compact .assistant-message p { margin-bottom: 10px; }

    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1.08em;
      margin-left: 2px;
      border-radius: 1px;
      background: #111;
      vertical-align: -.18em;
      animation: blink .8s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .response-tools { height: 28px; margin-top: 2px; display: flex; align-items: center; gap: 2px; color: #676767; }
    .response-tools button { width: 30px; height: 30px; padding: 5px; border: 0; border-radius: 7px; display: grid; place-items: center; background: transparent; }
    .response-tools button:hover { background: #f3f3f3; }
    .response-tools .icon { width: 18px; height: 18px; flex-basis: 18px; stroke-width: 1.8; }

    .composer-shell {
      position: absolute;
      z-index: 4;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 32px 24px 10px;
      background: linear-gradient(to bottom, rgba(255,255,255,0), #fff 32px, #fff 100%);
    }

    .composer {
      width: min(var(--composer-width), 100%);
      min-height: 104px;
      margin: 0 auto;
      padding: 13px 14px 9px 16px;
      border: 1px solid #dedede;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .prompt {
      width: 100%;
      height: 41px;
      padding: 0 3px;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      color: #2b2b2b;
      font-size: 15.5px;
      line-height: 22px;
      overflow: hidden;
    }

    .prompt::placeholder { color: #909090; }
    .composer-row { display: flex; align-items: center; justify-content: space-between; }
    .composer-left, .composer-right { display: flex; align-items: center; gap: 6px; }

    .round-control, .tools-control {
      height: 36px;
      border: 0;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      cursor: default;
    }

    .round-control { width: 36px; padding: 6px; }
    .tools-control { padding: 0 8px 0 6px; gap: 6px; font-size: 14px; }
    .round-control:hover, .tools-control:hover { background: #f2f2f2; }
    .round-control .icon, .tools-control .icon { width: 20px; height: 20px; flex-basis: 20px; }

    .send-button {
      width: 36px;
      height: 36px;
      padding: 7px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      background: #000;
      cursor: pointer;
    }

    .send-button:disabled { background: #d3d3d3; cursor: default; }
    .send-button .icon { width: 20px; height: 20px; flex-basis: 20px; stroke-width: 2; }

    .disclaimer {
      width: min(var(--composer-width), 100%);
      margin: 8px auto 0;
      color: #777;
      text-align: center;
      font-size: 12px;
      line-height: 16px;
    }

    .collapsed-sidebar-button { display: grid; }

    @media (max-width: 780px) {
      .share-button span { display: none; }
      .share-button { width: 36px; padding: 7px; }
      .thread { width: calc(100% - 32px); padding-top: 12px; }
      .composer-shell { padding-left: 12px; padding-right: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing-cursor { animation: none; }
    }
  </style>
</head>
<body>
  <!-- Inline SVG icon sprite: no icon fonts, emoji, or external assets. -->
  <svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.9" cy="10.9" r="6.8"/><path d="m16 16 4.2 4.2"/></symbol>
      <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3.1" y="3.5" width="17.8" height="17" rx="3.2"/><path d="M9 3.8v16.4"/></symbol>
      <symbol id="i-compose" viewBox="0 0 24 24"><path d="M13.8 5H7.2A3.2 3.2 0 0 0 4 8.2v8.6A3.2 3.2 0 0 0 7.2 20h8.6a3.2 3.2 0 0 0 3.2-3.2v-6.3"/><path d="m11.1 13.1.3-2.8 6.9-6.9a1.65 1.65 0 0 1 2.3 2.3l-6.9 6.9-2.6.5Z"/></symbol>
      <symbol id="i-images" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2.7"/><circle cx="8.5" cy="9" r="1.4"/><path d="m5.5 17 4.2-4.3 2.8 2.6 2.2-2.1 3.8 3.8"/></symbol>
      <symbol id="i-library" viewBox="0 0 24 24"><rect x="3.2" y="4.1" width="4.5" height="16" rx="1.5"/><rect x="9.7" y="4.1" width="4.5" height="16" rx="1.5"/><path d="m16.5 4.7 2.25-.6a1.45 1.45 0 0 1 1.8 1.05l3.05 12.55a1.5 1.5 0 0 1-1.1 1.8l-2.15.5a1.45 1.45 0 0 1-1.75-1.05L15.5 6.5a1.5 1.5 0 0 1 1-1.8Z" transform="translate(-1)"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.1v5l-3 2"/></symbol>
      <symbol id="i-plugins" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><circle cx="8" cy="14" r="4"/><circle cx="16" cy="14" r="4"/></symbol>
      <symbol id="i-codex" viewBox="0 0 24 24"><path d="M7.2 18.5a4.7 4.7 0 0 1-1.5-9.15A6.4 6.4 0 0 1 18 10.7a3.9 3.9 0 0 1-1.2 7.8Z"/><path d="m10.2 12-2 2 2 2m3.6-4 2 2-2 2"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m7 9.5 5 5 5-5"/></symbol>
      <symbol id="i-store" viewBox="0 0 24 24"><path d="M4.2 9.5v8.2A2.3 2.3 0 0 0 6.5 20h11a2.3 2.3 0 0 0 2.3-2.3V9.5"/><path d="M3.2 9.5h17.6L19 4H5Z"/><path d="M8.4 9.5V4m7.2 5.5V4M9 20v-5.2h6V20"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15.5V3.8m0 0L8.1 7.7M12 3.8l3.9 3.9"/><path d="M6.5 10.5H5.3A2.3 2.3 0 0 0 3 12.8v5.9A2.3 2.3 0 0 0 5.3 21h13.4a2.3 2.3 0 0 0 2.3-2.3v-5.9a2.3 2.3 0 0 0-2.3-2.3h-1.2"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="8.5" y="3" width="7" height="12" rx="3.5"/><path d="M5.5 11.5v.5a6.5 6.5 0 0 0 13 0v-.5M12 18.5V22"/></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5m0 0L6.8 10.2M12 5l5.2 5.2"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
      <symbol id="i-thumb" viewBox="0 0 24 24"><path d="M7 10v10H4V10Zm0 9h10.1a2 2 0 0 0 1.95-1.56l1.35-6A2 2 0 0 0 18.45 9H14l.45-3.45A2.25 2.25 0 0 0 12.22 3L7 10Z"/></symbol>
      <symbol id="i-regenerate" viewBox="0 0 24 24"><path d="M20 7v5h-5"/><path d="M18.4 16.5A8 8 0 1 1 19.8 9"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <main class="main">
      <header class="main-header">
        <div class="main-header-left">
          <button class="icon-button collapsed-sidebar-button" aria-label="Open sidebar"><svg class="icon"><use href="#i-panel"/></svg></button>
          <button class="model-button">ChatGPT <svg class="icon"><use href="#i-chevron-down"/></svg></button>
        </div>
        <div class="main-actions">
          <button class="share-button"><svg class="icon"><use href="#i-share"/></svg><span>Share</span></button>
          <button class="more-button" aria-label="More options"><svg class="icon"><use href="#i-more"/></svg></button>
        </div>
      </header>

      <div class="conversation" id="conversation">
        <div class="thread empty" id="thread" role="log" aria-live="polite"></div>
      </div>

      <div class="composer-shell">
        <div class="composer">
          <textarea class="prompt" id="prompt" rows="2" aria-label="Message ChatGPT">Can you explain how the human respiratory system works?</textarea>
          <div class="composer-row">
            <div class="composer-left">
              <button class="round-control" aria-label="Add attachment"><svg class="icon"><use href="#i-plus"/></svg></button>
              <button class="tools-control"><svg class="icon"><use href="#i-sliders"/></svg><span>Tools</span></button>
            </div>
            <div class="composer-right">
              <button class="round-control" aria-label="Voice input"><svg class="icon"><use href="#i-mic"/></svg></button>
              <button class="send-button" id="send" aria-label="Send message"><svg class="icon"><use href="#i-arrow-up"/></svg></button>
            </div>
          </div>
        </div>
        <div class="disclaimer">ChatGPT can make mistakes. Check important info.</div>
      </div>
    </main>
  </div>

  <script>
    (() => {
      const PARAGRAPHS = [
        "Respiration is regarded as the process (by which air is moved in and out of the lungs). Through respiration, oxygen is delivered — to where it is needed in the body — and carbon dioxide is removed from the body. Three phases — inhaling, exchanging, and exhaling — are involved in respiration.",
        "The respiratory process (as discussed below) is controlled by the nervous system. The respiratory center is located in the rear, bottom part of the brain — near the back of the neck. The respiratory center of the brain is connected to a pathway of nerves — one that is led down from the spinal cord to be connected with muscles controlling the diaphragm and rib cage. When the need for more oxygen in the bloodstream is detected by the brain, a signal to inhale is sent out (in response) by the respiratory center in the brain. The signal is moved — along the pathway of nerves — to muscles controlling the diaphragm and rib cage. When the need for less carbon dioxide in the bloodstream is detected by the brain, the signal to inhale is terminated and (in turn) the signal to exhale is initiated by the respiratory center in the brain. The signal to exhale is then moved along the pathway of nerves (along the same route as before) to the muscles controlling the diaphragm and rib cage.",
        "The thoracic cavity (in which the lungs are contained) is regarded as the space in the chest. It is surrounded by the rib cage — which can be moved slightly inward or outward — and the diaphragm on the bottom, a dome-shaped muscle below the lungs that can be moved downward. The diaphragm (as noted above) is located underneath the lungs. The lower part of the thoracic cavity is lined by it — sealing it off from the rest of the body. The main muscles involved in respiration (as identified here) are regarded as the diaphragm and the rib muscles. The rib muscles are attached to the ribs — by which the lungs are encircled. When in the relaxed position, the ribs are held slightly inward, and the diaphragm dome (in its resting shape) is curved upward."
      ];

      const prompt = document.getElementById('prompt');
      const send = document.getElementById('send');
      const thread = document.getElementById('thread');
      const conversation = document.getElementById('conversation');
      let running = false;

      function scrollDown() { conversation.scrollTop = conversation.scrollHeight; }

      function fitConversation() {
        const assistant = thread.querySelector('.assistant-message');
        if (!assistant || running) return;

        thread.classList.remove('compact');
        let fontSize = 15.25;
        assistant.style.fontSize = `${fontSize}px`;

        while (conversation.scrollHeight > conversation.clientHeight + 2 && fontSize > 14.25) {
          fontSize -= 0.25;
          assistant.style.fontSize = `${fontSize}px`;
        }

        if (conversation.scrollHeight > conversation.clientHeight + 2) {
          thread.classList.add('compact');
        }

        requestAnimationFrame(() => { conversation.scrollTop = 0; });
      }

      function responseTools() {
        const row = document.createElement('div');
        row.className = 'response-tools';
        row.innerHTML = `
          <button aria-label="Copy"><svg class="icon"><use href="#i-copy"/></svg></button>
          <button aria-label="Good response"><svg class="icon"><use href="#i-thumb"/></svg></button>
          <button aria-label="Bad response"><svg class="icon" style="transform:rotate(180deg)"><use href="#i-thumb"/></svg></button>
          <button aria-label="Regenerate"><svg class="icon"><use href="#i-regenerate"/></svg></button>
          <button aria-label="More"><svg class="icon"><use href="#i-more"/></svg></button>`;
        return row;
      }

      async function typeParagraph(element, text) {
        const cursor = document.createElement('span');
        cursor.className = 'typing-cursor';
        element.appendChild(cursor);
        const words = text.split(' ');
        for (let i = 0; i < words.length; i++) {
          cursor.before(document.createTextNode((i ? ' ' : '') + words[i]));
          if (i % 3 === 0) scrollDown();
          await new Promise(resolve => setTimeout(resolve, 13));
        }
        cursor.remove();
      }

      async function submit() {
        if (running || !prompt.value.trim()) return;
        running = true;
        send.disabled = true;
        thread.classList.remove('empty');
        thread.innerHTML = '';

        const user = document.createElement('div');
        user.className = 'user-message';
        user.textContent = prompt.value.trim();
        thread.appendChild(user);

        const assistant = document.createElement('div');
        assistant.className = 'assistant-message';
        thread.appendChild(assistant);
        prompt.value = '';
        scrollDown();

        for (const text of PARAGRAPHS) {
          const paragraph = document.createElement('p');
          assistant.appendChild(paragraph);
          await typeParagraph(paragraph, text);
        }
        assistant.appendChild(responseTools());
        running = false;
        requestAnimationFrame(fitConversation);
      }

      send.addEventListener('click', submit);
      prompt.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          submit();
        }
      });
      window.addEventListener('resize', fitConversation);
    })();
  </script>
</body>
</html>
