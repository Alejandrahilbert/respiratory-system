<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT</title>
  <style>
    :root {
      --sidebar-width: 260px;
      --sidebar-bg: #f9f9f9;
      --page-bg: #fff;
      --ink: #0d0d0d;
      --muted: #676767;
      --quiet: #8f8f8f;
      --hover: #ececec;
      --bubble: #f4f4f4;
      --rule: #e7e7e7;
      --content-width: 768px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--page-bg);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, textarea { font: inherit; }
    button { color: inherit; }

    .icon {
      width: 24px;
      height: 24px;
      display: block;
      flex: 0 0 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .app { min-height: 100dvh; display: flex; }

    .sidebar {
      width: var(--sidebar-width);
      height: 100dvh;
      flex: 0 0 var(--sidebar-width);
      display: flex;
      flex-direction: column;
      background: var(--sidebar-bg);
      border-right: 1px solid #ededed;
      overflow: hidden;
    }

    .sidebar-header {
      height: 64px;
      padding: 0 14px 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      margin: 0;
      font-size: 20px;
      line-height: 1;
      font-weight: 650;
      letter-spacing: -0.55px;
    }

    .header-actions { display: flex; align-items: center; gap: 3px; }

    .icon-button {
      width: 36px;
      height: 36px;
      padding: 6px;
      border: 0;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: transparent;
      cursor: default;
    }

    .icon-button:hover { background: var(--hover); }

    .sidebar-scroll {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      padding: 15px 8px 22px;
      scrollbar-width: none;
    }

    .sidebar-scroll::-webkit-scrollbar { display: none; }

    .nav-list { display: grid; gap: 2px; }

    .nav-row {
      min-height: 42px;
      width: 100%;
      padding: 7px 10px;
      border: 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 11px;
      background: transparent;
      color: #171717;
      text-align: left;
      font-size: 15px;
      line-height: 22px;
      white-space: nowrap;
      cursor: default;
    }

    .nav-row:hover { background: var(--hover); }
    .nav-row .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

    .section { margin-top: 27px; }

    .section-heading {
      height: 28px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      color: var(--quiet);
      font-size: 14px;
      font-weight: 600;
    }

    .chat-list { display: grid; gap: 1px; }

    .chat-row {
      min-height: 36px;
      padding: 6px 10px;
      font-size: 14px;
      color: #333;
    }

    .sidebar-footer {
      height: 72px;
      flex: 0 0 72px;
      padding: 10px 10px;
      border-top: 1px solid var(--rule);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #10a37f;
      color: white;
      font-size: 12px;
      letter-spacing: -.2px;
    }

    .account-copy { min-width: 0; flex: 1; }
    .account-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 19px; }
    .account-plan { color: #8a8a8a; font-size: 12px; line-height: 16px; }

    .main {
      min-width: 0;
      height: 100dvh;
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--page-bg);
    }

    .main-header {
      height: 56px;
      flex: 0 0 56px;
      padding: 0 18px 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,.92);
      z-index: 5;
    }

    .model-button, .share-button, .more-button {
      border: 0;
      background: transparent;
      border-radius: 9px;
      height: 36px;
      display: flex;
      align-items: center;
      cursor: default;
    }

    .model-button { padding: 0 9px; gap: 7px; font-size: 18px; font-weight: 600; letter-spacing: -.3px; }
    .model-button:hover, .share-button:hover, .more-button:hover { background: #f4f4f4; }
    .model-button .icon { width: 16px; height: 16px; flex-basis: 16px; stroke-width: 2; }

    .main-actions { display: flex; align-items: center; gap: 4px; }
    .share-button { padding: 0 10px; gap: 7px; font-size: 14px; font-weight: 500; }
    .share-button .icon { width: 20px; height: 20px; flex-basis: 20px; }
    .more-button { width: 36px; padding: 6px; justify-content: center; }

    .conversation {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }

    .thread {
      width: min(var(--content-width), calc(100% - 48px));
      min-height: 100%;
      margin: 0 auto;
      padding: 26px 0 190px;
      display: flex;
      flex-direction: column;
      gap: 29px;
    }

    .thread.empty { justify-content: flex-end; }

    .user-message {
      max-width: min(78%, 590px);
      margin-left: auto;
      padding: 10px 16px;
      border-radius: 22px;
      background: var(--bubble);
      font-size: 16px;
      line-height: 1.5;
    }

    .assistant-message { max-width: 100%; font-size: 16px; line-height: 1.72; color: #181818; }
    .assistant-message p { margin: 0 0 20px; }
    .assistant-message p:last-child { margin-bottom: 0; }

    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1.08em;
      margin-left: 2px;
      border-radius: 1px;
      background: #111;
      vertical-align: -.18em;
      animation: blink .8s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .response-tools { height: 28px; margin-top: 4px; display: flex; align-items: center; gap: 2px; color: #676767; }
    .response-tools button { width: 30px; height: 30px; padding: 5px; border: 0; border-radius: 7px; display: grid; place-items: center; background: transparent; }
    .response-tools button:hover { background: #f3f3f3; }
    .response-tools .icon { width: 18px; height: 18px; flex-basis: 18px; stroke-width: 1.8; }

    .composer-shell {
      position: absolute;
      z-index: 4;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 42px 24px 13px;
      background: linear-gradient(to bottom, rgba(255,255,255,0), #fff 32px, #fff 100%);
    }

    .composer {
      width: min(var(--content-width), 100%);
      min-height: 112px;
      margin: 0 auto;
      padding: 15px 14px 10px 16px;
      border: 1px solid #dedede;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .prompt {
      width: 100%;
      height: 45px;
      padding: 0 3px;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      color: #2b2b2b;
      font-size: 16px;
      line-height: 24px;
      overflow: hidden;
    }

    .prompt::placeholder { color: #909090; }
    .composer-row { display: flex; align-items: center; justify-content: space-between; }
    .composer-left, .composer-right { display: flex; align-items: center; gap: 6px; }

    .round-control, .tools-control {
      height: 36px;
      border: 0;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      cursor: default;
    }

    .round-control { width: 36px; padding: 6px; }
    .tools-control { padding: 0 8px 0 6px; gap: 6px; font-size: 14px; }
    .round-control:hover, .tools-control:hover { background: #f2f2f2; }
    .round-control .icon, .tools-control .icon { width: 20px; height: 20px; flex-basis: 20px; }

    .send-button {
      width: 36px;
      height: 36px;
      padding: 7px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      background: #000;
      cursor: pointer;
    }

    .send-button:disabled { background: #d3d3d3; cursor: default; }
    .send-button .icon { width: 20px; height: 20px; flex-basis: 20px; stroke-width: 2; }

    .disclaimer {
      width: min(var(--content-width), 100%);
      margin: 8px auto 0;
      color: #777;
      text-align: center;
      font-size: 12px;
      line-height: 16px;
    }

    .mobile-sidebar-button { display: none; }

    @media (max-width: 780px) {
      .sidebar { display: none; }
      .mobile-sidebar-button { display: grid; }
      .main-header { padding-left: 8px; }
      .main-header-left { display: flex; align-items: center; }
      .share-button span { display: none; }
      .share-button { width: 36px; padding: 7px; }
      .thread { width: calc(100% - 32px); padding-top: 16px; }
      .composer-shell { padding-left: 12px; padding-right: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing-cursor { animation: none; }
    }
  </style>
</head>
<body>
  <!-- Every sidebar image is an inline SVG: there are no icon fonts, emoji, or external assets. -->
  <svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.9" cy="10.9" r="6.8"/><path d="m16 16 4.2 4.2"/></symbol>
      <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3.1" y="3.5" width="17.8" height="17" rx="3.2"/><path d="M9 3.8v16.4"/></symbol>
      <symbol id="i-compose" viewBox="0 0 24 24"><path d="M13.8 5H7.2A3.2 3.2 0 0 0 4 8.2v8.6A3.2 3.2 0 0 0 7.2 20h8.6a3.2 3.2 0 0 0 3.2-3.2v-6.3"/><path d="m11.1 13.1.3-2.8 6.9-6.9a1.65 1.65 0 0 1 2.3 2.3l-6.9 6.9-2.6.5Z"/></symbol>
      <symbol id="i-images" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2.7"/><circle cx="8.5" cy="9" r="1.4"/><path d="m5.5 17 4.2-4.3 2.8 2.6 2.2-2.1 3.8 3.8"/></symbol>
      <symbol id="i-library" viewBox="0 0 24 24"><rect x="3.2" y="4.1" width="4.5" height="16" rx="1.5"/><rect x="9.7" y="4.1" width="4.5" height="16" rx="1.5"/><path d="m16.5 4.7 2.25-.6a1.45 1.45 0 0 1 1.8 1.05l3.05 12.55a1.5 1.5 0 0 1-1.1 1.8l-2.15.5a1.45 1.45 0 0 1-1.75-1.05L15.5 6.5a1.5 1.5 0 0 1 1-1.8Z" transform="translate(-1)"/></symbol>

  </svg>

  <div class="app">
    <aside class="sidebar" aria-label="ChatGPT sidebar">
      <div class="sidebar-header">
        <h1 class="wordmark">ChatGPT</h1>
        <div class="header-actions">
          <button class="icon-button" aria-label="Search"><svg class="icon"><use href="#i-search"/></svg></button>
          <button class="icon-button" aria-label="Close sidebar"><svg class="icon"><use href="#i-panel"/></svg></button>
        </div>
      </div>

      <div class="sidebar-scroll">
        <nav class="nav-list" aria-label="Main navigation">
          <button class="nav-row"><svg class="icon"><use href="#i-compose"/></svg><span class="label">New chat</span></button>
          <button class="nav-row"><svg class="icon"><use href="#i-images"/></svg><span class="label">Images</span></button>
          <button class="nav-row"><svg class="icon"><use href="#i-library"/></svg><span class="label">Library</span></button>
          <button class="nav-row"><svg class="icon"><use href="#i-clock"/></svg><span class="label">Scheduled</span></button>
          <button class="nav-row"><svg class="icon"><use href="#i-plugins"/></svg><span class="label">Plugins</span></button>
          <button class="nav-row"><svg class="icon"><use href="#i-codex"/></svg><span class="label">Codex</span></button>
          <button class="nav-row"><svg class="icon"><use href="#i-more"/></svg><span class="label">More</span></button>
        </nav>

        <section class="section">
          <div class="section-heading">Chats</div>
          <div class="chat-list">
            <button class="nav-row chat-row"><span class="label">Respiratory system</span></button>
            <button class="nav-row chat-row"><span class="label">Study notes</span></button>
            <button class="nav-row chat-row"><span class="label">Weekend ideas</span></button>
            <button class="nav-row chat-row"><span class="label">Email draft</span></button>
          </div>
        </section>
      </div>

      <div class="sidebar-footer">
        <div class="avatar" aria-hidden="true">AH</div>
        <div class="account-copy"><div class="account-name">Alejandra Hilbert</div><div class="account-plan">Free</div></div>
        <svg class="icon" style="width:21px;height:21px;flex-basis:21px;color:#777"><use href="#i-store"/></svg>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <div class="main-header-left">
          <button class="icon-button mobile-sidebar-button" aria-label="Open sidebar"><svg class="icon"><use href="#i-panel"/></svg></button>
          <button class="model-button">ChatGPT <svg class="icon"><use href="#i-chevron-down"/></svg></button>
        </div>
        <div class="main-actions">
          <button class="share-button"><svg class="icon"><use href="#i-share"/></svg><span>Share</span></button>
          <button class="more-button" aria-label="More options"><svg class="icon"><use href="#i-more"/></svg></button>
        </div>
      </header>

      <div class="conversation" id="conversation">
        <div class="thread empty" id="thread" role="log" aria-live="polite"></div>
      </div>

      <div class="composer-shell">
        <div class="composer">
          <textarea class="prompt" id="prompt" rows="2" aria-label="Message ChatGPT">Can you explain how the human respiratory system works?</textarea>
          <div class="composer-row">
            <div class="composer-left">
              <button class="round-control" aria-label="Add attachment"><svg class="icon"><use href="#i-plus"/></svg></button>
              <button class="tools-control"><svg class="icon"><use href="#i-sliders"/></svg><span>Tools</span></button>
            </div>
            <div class="composer-right">
              <button class="round-control" aria-label="Voice input"><svg class="icon"><use href="#i-mic"/></svg></button>
              <button class="send-button" id="send" aria-label="Send message"><svg class="icon"><use href="#i-arrow-up"/></svg></button>
            </div>
          </div>
        </div>
        <div class="disclaimer">ChatGPT can make mistakes. Check important info.</div>
      </div>
    </main>
  </div>

  <script>
    (() => {
      const PARAGRAPHS = [
        [
          { text: "Respiration " },
          { text: "is regarded as", bold: true },
          { text: " the process (by which air is moved in and out of the lungs). Through respiration, oxygen " },
          { text: "is delivered", bold: true },
          { text: " " },
          { text: "—", bold: true },
          { text: " to where it is needed in the body " },
          { text: "—", bold: true },
          { text: " and carbon dioxide " },
          { text: "is removed", bold: true },
          { text: " from the body. Three phases " },
          { text: "—", bold: true },
          { text: " inhaling, exchanging, and exhaling " },
          { text: "—", bold: true },
          { text: " " },
          { text: "are involved", bold: true },
          { text: " in respiration." }
        ],
        [
          { text: "The respiratory process " },
          { text: "is controlled", bold: true },
          { text: " by the nervous system (as discussed below). The respiratory center " },
          { text: "is located", bold: true },
          { text: " in the rear, bottom part of the brain " },
          { text: "—", bold: true },
          { text: " near the back of the neck. The respiratory center of the brain " },
          { text: "is connected", bold: true },
          { text: " to a pathway of nerves " },
          { text: "—", bold: true },
          { text: " one that " },
          { text: "is led down", bold: true },
          { text: " from the spinal cord to be connected with muscles controlling the diaphragm and rib cage. When the need for more oxygen in the bloodstream " },
          { text: "is detected", bold: true },
          { text: " by the brain, a signal to inhale " },
          { text: "is sent out", bold: true },
          { text: " by the respiratory center in the brain (in response). The signal " },
          { text: "is moved", bold: true },
          { text: " " },
          { text: "—", bold: true },
          { text: " along the pathway of nerves " },
          { text: "—", bold: true },
          { text: " to muscles controlling the diaphragm and rib cage. When the need for less carbon dioxide in the bloodstream " },
          { text: "is detected", bold: true },
          { text: " by the brain, the signal to inhale " },
          { text: "is terminated", bold: true },
          { text: " and the signal to exhale " },
          { text: "is initiated", bold: true },
          { text: " by the respiratory center in the brain (in turn). The signal to exhale " },
          { text: "is then moved", bold: true },
          { text: " along the pathway of nerves to the muscles controlling the diaphragm and rib cage (along the same route as before)." }
        ],
        [
          { text: "The thoracic cavity " },
          { text: "is regarded as", bold: true },
          { text: " the space in the chest (in which the lungs are contained). It " },
          { text: "is surrounded", bold: true },
          { text: " by the rib cage " },
          { text: "—", bold: true },
          { text: " which " },
          { text: "can be moved", bold: true },
          { text: " slightly inward or outward " },
          { text: "—", bold: true },
          { text: " and the diaphragm on the bottom, a dome-shaped muscle below the lungs that " },
          { text: "can be moved", bold: true },
          { text: " downward. The diaphragm " },
          { text: "is located", bold: true },
          { text: " underneath the lungs (as noted above). The lower part of the thoracic cavity " },
          { text: "is lined", bold: true },
          { text: " by it " },
          { text: "—", bold: true },
          { text: " sealing it off from the rest of the body. The main muscles involved in respiration " },
          { text: "are regarded as", bold: true },
          { text: " the diaphragm and the rib muscles (as identified here). The rib muscles " },
          { text: "are attached", bold: true },
          { text: " to the ribs " },
          { text: "—", bold: true },
          { text: " by which the lungs " },
          { text: "are encircled", bold: true },
          { text: ". When in the relaxed position, the ribs " },
          { text: "are held", bold: true },
          { text: " slightly inward, and the diaphragm dome " },
          { text: "is curved", bold: true },
          { text: " upward (in its resting shape)." }
        ]
      ];

      const prompt = document.getElementById('prompt');
      const send = document.getElementById('send');
      const thread = document.getElementById('thread');
      const conversation = document.getElementById('conversation');
      let running = false;

      function scrollDown() { conversation.scrollTop = conversation.scrollHeight; }

      function responseTools() {
        const row = document.createElement('div');
        row.className = 'response-tools';
        row.innerHTML = `
          <button aria-label="Copy"><svg class="icon"><use href="#i-copy"/></svg></button>
          <button aria-label="Good response"><svg class="icon"><use href="#i-thumb"/></svg></button>
          <button aria-label="Bad response"><svg class="icon" style="transform:rotate(180deg)"><use href="#i-thumb"/></svg></button>
          <button aria-label="Regenerate"><svg class="icon"><use href="#i-regenerate"/></svg></button>
          <button aria-label="More"><svg class="icon"><use href="#i-more"/></svg></button>`;
        return row;
      }

      async function typeParagraph(element, segments) {
        const cursor = document.createElement('span');
        cursor.className = 'typing-cursor';
        element.appendChild(cursor);
        let wordCount = 0;
        for (const segment of segments) {
          const container = document.createElement('span');
          cursor.before(container);
          const chunks = segment.text.match(/\S+\s*|\s+/g) || [];
          for (const chunk of chunks) {
            container.appendChild(document.createTextNode(chunk));
            if (wordCount++ % 3 === 0) scrollDown();
            await new Promise(resolve => setTimeout(resolve, 13));
          }
        }
        cursor.remove();
      }

      async function submit() {
        if (running || !prompt.value.trim()) return;
        running = true;
        send.disabled = true;
        thread.classList.remove('empty');
        thread.innerHTML = '';

        const user = document.createElement('div');
        user.className = 'user-message';
        user.textContent = prompt.value.trim();
        thread.appendChild(user);

        const assistant = document.createElement('div');
        assistant.className = 'assistant-message';
        thread.appendChild(assistant);
        prompt.value = '';
        scrollDown();

        for (const text of PARAGRAPHS) {
          const paragraph = document.createElement('p');
          assistant.appendChild(paragraph);
          await typeParagraph(paragraph, text);
        }
        assistant.appendChild(responseTools());
        scrollDown();
        running = false;
      }

      send.addEventListener('click', submit);
      prompt.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          submit();
        }
      });
    })();
  </script>
</body>
</html>
